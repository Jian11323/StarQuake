[package]
name = "starquake-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "starquake"
path = "src/main.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
starquake-ui = { workspace = true }
starquake-map = { workspace = true }
starquake-core = { workspace = true }
starquake-util = { workspace = true }
starquake-config = { workspace = true }
starquake-travel = { workspace = true }
starquake-net = { workspace = true }
starquake-audio = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
notify-rust = "4"
tray-icon = "0.23.1"
muda = "0.19"
raw-window-handle = "0.6"
# msedge-tts 与 reqwest 同时链入 aws-lc / ring 时需显式选定 CryptoProvider
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
