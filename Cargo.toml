[workspace]
resolver = "2"
members = [
    "crates/starquake-util",
    "crates/starquake-core",
    "crates/starquake-travel",
    "crates/starquake-hypo",
    "crates/starquake-config",
    "crates/starquake-net",
    "crates/starquake-audio",
    "crates/starquake-map",
    "crates/starquake-ui",
    "crates/starquake-app",
    "tools/convert_travel_tables",
]
default-members = ["crates/starquake-app"]
exclude = ["tools/gen_brand_icon"]

[workspace.package]
version = "2.3.2-beta"
edition = "2021"
license = "Apache-2.0"
authors = ["Jian11323"]
repository = "https://github.com/Jian11323/StarQuake"

[workspace.dependencies]
starquake-util = { path = "crates/starquake-util" }
starquake-core = { path = "crates/starquake-core" }
starquake-travel = { path = "crates/starquake-travel" }
starquake-hypo = { path = "crates/starquake-hypo" }
starquake-config = { path = "crates/starquake-config" }
starquake-net = { path = "crates/starquake-net" }
starquake-audio = { path = "crates/starquake-audio" }
starquake-map = { path = "crates/starquake-map" }
starquake-ui = { path = "crates/starquake-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["parse", "display"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# 仅 Glow/OpenGL，不拉 wgpu（设置里已去掉 Vulkan）
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.31"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
resvg = { version = "0.45", default-features = false }
rodio = { version = "0.20", features = ["wav", "mp3"] }
earcutr = "0.5"
