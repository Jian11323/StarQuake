[sources.stations]
jma_enabled = true
# jian / kmoni / lmoni
jma_source = "jian"
jma_jian_ws = "wss://api.sismotide.top/kmoni"
snet_enabled = false
snet_source = "jian"
snet_jian_ws = "wss://api.sismotide.top/s-net"
kma_enabled = true
kma_jian_ws = "wss://api.sismotide.top/kma-station"

[sources.wolfx]
enabled = true
eew_enabled = true
eqlist_enabled = true
# 默认仅 JMA + CENC（国网，展示为 [CN]）预警；省局/CWA 默认关
jma_eew = true
sc_eew = false
fj_eew = false
cq_eew = false
cenc_eew = true
cwa_eew = false
cenc_eqlist = true
jma_eqlist = true

[sources.fssn]
enabled = true
ws_url = "wss://fssn-api.fanstudio.tech/fssn"

[sources.p2pquake]
enabled = true
# HTTP 轮询间隔（秒）；最低 1，默认 1.5
poll_secs = 1.5

[sources.pancakes]
enabled = true
# GlobalQuake 最低震级（0=不过滤）
