[log]
# error | warn | info | debug | trace（环境变量 RUST_LOG 优先）
level = "info"
# Windows 安装版忽略相对路径，固定写到 %APPDATA%/StarQuake/log.txt；便携包可写时也优先用户目录
dir = "logs"
# 是否写 stderr（不分配控制台窗口；安装版无黑框）
console = false
# 按修改时间清理旧日志；0=不清理
keep_days = 14
enabled = true

[ui]
theme = "dark"
# zh-CN | zh-TW | ja | en
language = "zh-CN"
show_nied_clock = false
sidebar_default_tab = "eew"
# 右侧情报列表；关闭后可从右缘拉开或地图右键菜单操作
show_sidebar = true
# 侧栏分离为独立窗口（可从侧栏标题栏或设置切换）
sidebar_detached = false
intensity_scale = "auto"
always_on_top = false
minimize_to_tray = true
auto_follow_eew = true
auto_zoom_waves = true
show_wave_rings = true
show_legend = true
show_volcanoes = true
show_typhoons = true
show_faults = false
show_terminator = false
# 全部 | 中国 | 中国台湾 | 日本 | 美国 | 中国香港
typhoon_forecast_agency = "中国"


[performance]
# cpu = 软渲染（帧率封顶）；gpu = OpenGL 硬件加速（改设备后需重启）
device = "gpu"
# eco 节能 | normal 正常 | extreme 极致（档位热重载，无需重启）
# 节能：空闲约 1.5 秒、波圈约 10fps；正常：空闲约 1 秒；极致：空闲也跟目标帧率
# 瓦片缓存按内存五档：2G→64 / 4G→128 / 8G→256 / 16G→512 / 大于16G→800；软渲染再压一档
profile = "normal"
# 交互/波圈跟手上限（镜头跳转按墙钟，与帧率无关）；空闲另有降频
# 档位：30 / 45 / 60 / 75 / 90 / 120 / 144 / 165 / 180 / 240 / 300（默认 60；诊断可跟主屏刷新率）
target_fps = 60

[window]
# 主窗口几何（调整后自动写入用户配置）；默认 1280x720，最小 640x480
width = 1280.0
height = 720.0
# x / y 省略则由系统摆放
maximized = false

[map]
# auto = 暗色要石矢量 / 亮色地形瓦片；也可强制 vector | tiles | both
basemap = "auto"
# flat = 平面 Web Mercator；globe = 立体球（矢量）
projection = "flat"
geodata_dir = "geodata"
tile_base = "https://tilemap.sismotide.top"
# 自有海洋地形底图（亮色模式）
tile_source = "arcwob"
default_lon = 135.0
default_lat = 35.0
default_zoom = 6.8

[audio]
event_pack = "srev"
countdown_pack = "countdown"
master_volume = 0.8
countdown_volume = 1.0
mute = false
# TTS 语音播报（默认关）
tts_enabled = false
# offline = 系统离线语音包；edge = 微软 Edge 在线 TTS
tts_engine = "offline"
# 离线音色（Windows SAPI 语音名；空=系统默认）
tts_voice = ""
# Edge TTS 音色
tts_edge_voice = "zh-CN-XiaoxiaoNeural"
# 语速倍率 0.5–2.0
tts_rate = 1.0
# 倒计时：从剩余秒开始播语音，并循环滴答
play_countdown = true
countdown_speech = true
countdown_start = 10
# 仅本机预估震度≥3 / 烈度≥5 时播
countdown_only_intense = false
# NHK 一级新闻铃：情报震度 ≥6 弱
nhk_news_bell = true
# JMA 紧急地震速报「警报」（预报升级）
jma_eew_alert_sound = true
# 津波警报 / 大津波警报：紧急警报放送第 2 种
tsunami_ebs_sound = true

[notify]
enabled = true
on_eew = true
on_record = true
on_tsunami = true

[travel]
primary = "jma2001"
fallback = "ak135"
linear_last_resort = true
# 自定义震级区间→最大传播距离(km)；留空用内置表
# mag_spread_km = [{ min_magnitude = 3.0, max_magnitude = 4.9, max_km = 500.0 }, { min_magnitude = 5.0, max_magnitude = 9.5, max_km = 1600.0 }]

[local]
# latitude = 35.68
# longitude = 139.76

[sources.jian]
enabled = true
eew_enabled = true
record_enabled = true
jma_eew = true
cea_eew = true
cwa_eew = true
kma_eew = true
sa_eew = true
early_est_eew = true
# 兼容旧键：与 stations.jma_enabled + jma_source=jian 同步
station_enabled = true
